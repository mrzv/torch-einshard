[project]
name = "torch-einshard"
version = "1.0"
description = "Sharding in torch using einsum-like notation"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause-LBNL"
license-files = ["license.txt", "legal.txt"]
keywords = ["distributed", "einsum", "pytorch", "sharding", "tensor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.3.3",
    "parsley>=1.3",
    "torch>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/lbnl-sciml/torch-einshard"
Documentation = "https://github.com/lbnl-sciml/torch-einshard/tree/main/docs"
Issues = "https://github.com/lbnl-sciml/torch-einshard/issues"
Repository = "https://github.com/lbnl-sciml/torch-einshard"

[dependency-groups]
dev = [
    "furo>=2024.8.6",
    "icecream>=2.1.8",
    "myst-parser>=4.0.1",
    "pytest>=8.4.1",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx>=8.1.3",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
