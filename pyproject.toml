[project]
name = "torch-einshard"
version = "0.1.0"
description = "Sharding in torch using einsum-like notation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.3",
    "parsley>=1.3",
    "torch>=2.8.0",
]

[dependency-groups]
dev = [
    "icecream>=2.1.8",
    "pytest>=8.4.1",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
